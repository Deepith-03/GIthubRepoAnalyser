spring.application.name=github-chatbot
server.port=8081

# Docker PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/vector_db
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring AI PGVector Store Setup
spring.ai.vectorstore.pgvector.initialize-schema=true

# Google Gemini API Setup (OpenAI-Compatible endpoint)
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-1.5-flash

# Vertex AI Fallback Configuration
spring.ai.vertex.ai.gemini.project-id=${VERTEX_AI_PROJECT_ID:test-project}
spring.ai.vertex.ai.gemini.location=${VERTEX_AI_LOCATION:us-central1}

# GitHub Personal Access Token (for up to 5,000 requests/hr)
github.token=${GITHUB_TOKEN:}